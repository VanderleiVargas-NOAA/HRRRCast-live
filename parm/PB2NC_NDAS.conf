# PB2NC METplus Configuration — convert NDAS prepbufr to NetCDF for Point-Stat.
#
# Dynamic values (valid window, input/output dirs) are supplied by job-pb2nc.sh
# via environment variables and referenced here as {ENV[...]}.

[config]

PROCESS_LIST = PB2NC

# PB2NC works on observations, so loop by VALID time (one prepbufr per hour).
LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H
VALID_BEG = {ENV[VALID_BEG]}
VALID_END = {ENV[VALID_END]}
VALID_INCREMENT = 3600

LOG_METPLUS = {LOG_DIR}/metplus.log.PB2NC_NDAS_{ENV[INIT_STAMP]}
METPLUS_CONF = {PB2NC_OUTPUT_DIR}/metplus_final.PB2NC_NDAS_{ENV[INIT_STAMP]}.conf
LOG_PB2NC_VERBOSITY = 2

OBTYPE = NDAS

PB2NC_CONFIG_FILE = {PARM_BASE}/met_config/PB2NCConfig_wrapped

PB2NC_SKIP_IF_OUTPUT_EXISTS = True

###
# File I/O
###
OUTPUT_BASE           = {ENV[PB2NC_OUTPUT_DIR]}
PB2NC_INPUT_DIR       = {ENV[NDAS_OBS_DIR]}
PB2NC_OUTPUT_DIR      = {ENV[PB2NC_OUTPUT_DIR]}
PB2NC_INPUT_TEMPLATE  = nam.{valid?fmt=%Y%m%d}.t{valid?fmt=%H}z.prepbufr.nr
PB2NC_OUTPUT_TEMPLATE = nam.{valid?fmt=%Y%m%d%H}.prepbufr.nc

###
# Obs selection — adjust message types / variables to what you verify.
###
# Keep obs within +/- 30 min of the valid time.
PB2NC_WINDOW_BEGIN = -1800
PB2NC_WINDOW_END   = 1800

# Surface (and add ADPUPA for upper-air if you verify aloft).
PB2NC_MESSAGE_TYPE = ADPSFC, SFCSHP, MSONET

# Variables to extract (prepbufr names): temp, dewpoint, wind components, pressure.
PB2NC_OBS_BUFR_VAR_LIST = TOB, TDO, UOB, VOB, POB, PMO

PB2NC_QUALITY_MARK_THRESH = 2
PB2NC_PB_REPORT_TYPE =
PB2NC_LEVEL_CATEGORY =
PB2NC_GRID =
PB2NC_POLY = {MET_INSTALL_DIR}/share/met/poly/CONUS.poly
PB2NC_STATION_ID =
PB2NC_TIME_SUMMARY_FLAG = False
