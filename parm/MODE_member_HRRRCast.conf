# MODE METplus Configuration — LIVE workflow, RAW single member (member 0).
#
# Object-based verification (MET MODE) of one raw HRRRCast forecast member,
# straight from the member GRIB2 (hrrrcast.mNN.tHHz.pgrb2.fLL), against the raw
# gridded obs (MRMS composite reflectivity for REFC, CCPA 01h for APCP). No
# GenEnsProd / no NEP smoothing — objects are contiguous regions where the
# convolved physical field exceeds a threshold (REFC dBZ, APCP mm).
#
# Everything variable is driven by {ENV[...]} from jobs/job-mode-live.sh, which
# loops (field x threshold): REFC vs MRMS and APCP vs CCPA. Obs live on their own
# grids, so obs are regridded to the forecast (HRRR 3-km) grid.
#
# Min object area filter: 144 km^2 = 16 grid cells on the 3-km grid (9 km^2/cell).

[config]

PROCESS_LIST = MODE

LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG = {ENV[INIT_STAMP]}
INIT_END = {ENV[INIT_STAMP]}
INIT_INCREMENT = 3600

LEAD_SEQ = {ENV[LEAD_SEQ]}

LOG_METPLUS = {LOG_DIR}/metplus.log.MODE_mem{ENV[MODE_MEMBER]}_{ENV[MODE_FIELD]}_{ENV[MODE_THRESH_TAG]}_{ENV[INIT_STAMP]}
METPLUS_CONF = {MODE_OUTPUT_DIR}/metplus_final.MODE_mem{ENV[MODE_MEMBER]}_{ENV[MODE_FIELD]}_{ENV[MODE_THRESH_TAG]}_{ENV[INIT_STAMP]}.conf
LOG_MODE_VERBOSITY = 2

# ------------------------------- Field Info -------------------------------
# Raw field -> real convolution defines objects; conv_thresh is the physical
# threshold (dBZ / mm). Same radius/threshold on fcst and obs.
FCST_IS_PROB = false

FCST_MODE_CONV_RADIUS = {ENV[MODE_CONV_RADIUS]}
FCST_MODE_CONV_THRESH = {ENV[MODE_CONV_THRESH]}
# Double-threshold merging: MODE_MERGE_THRESH must be BELOW MODE_CONV_THRESH so
# objects sharing a common weaker-echo envelope merge. Same on fcst and obs.
FCST_MODE_MERGE_THRESH = {ENV[MODE_MERGE_THRESH]}
FCST_MODE_MERGE_FLAG = THRESH

OBS_MODE_CONV_RADIUS = {ENV[MODE_CONV_RADIUS]}
OBS_MODE_CONV_THRESH = {ENV[MODE_CONV_THRESH]}
OBS_MODE_MERGE_THRESH = {ENV[MODE_MERGE_THRESH]}
OBS_MODE_MERGE_FLAG = THRESH

# Drop objects smaller than 144 km^2 = 16 grid cells (3-km grid). Applied to
# fcst and obs before matching.
MODE_FCST_FILTER_ATTR_NAME = AREA
MODE_FCST_FILTER_ATTR_THRESH = >=16
MODE_OBS_FILTER_ATTR_NAME = AREA
MODE_OBS_FILTER_ATTR_THRESH = >=16

# Forecast member GRIB2: REFC/APCP at L0. Obs GRIB2: MRMS composite (Z500) or
# CCPA 01h (A1); obs name/level and censoring supplied per field by the job.
FCST_VAR1_NAME = {ENV[MODE_FIELD]}
FCST_VAR1_LEVELS = {ENV[MODE_FCST_LEVEL]}
OBS_VAR1_NAME = {ENV[MODE_OBS_NAME]}
OBS_VAR1_LEVELS = {ENV[MODE_OBS_LEVEL]}
OBS_VAR1_OPTIONS = {ENV[MODE_OBS_OPTIONS]}

FCST_MODE_FILE_WINDOW_BEGIN = 0
FCST_MODE_FILE_WINDOW_END = 0
# MRMS files are timestamped at the actual scan time (~40 s past the hour), so
# allow a +/-300 s window to match them to the on-the-hour valid time (same as
# GridStat_REFC). Harmless for CCPA, which is exactly on the hour.
OBS_MODE_FILE_WINDOW_BEGIN = -300
OBS_MODE_FILE_WINDOW_END = 300

# ------------------------------ MODE Settings -----------------------------
MODEL = HRRRCast
OBTYPE = {ENV[MODE_OBTYPE]}
MODE_DESC = NA

MODE_CONFIG_FILE = {PARM_BASE}/met_config/MODEConfig_wrapped

# Obs are on their own grid (MRMS/HRAP); bring them onto the forecast grid.
MODE_REGRID_TO_GRID = FCST
MODE_REGRID_METHOD = BUDGET
MODE_REGRID_WIDTH = 2
MODE_REGRID_VLD_THRESH = 0.5

MODE_GRID_RES = 3

MODE_TOTAL_INTEREST_THRESH = 0.7

MODE_MASK_MISSING_FLAG = BOTH
MODE_MATCH_FLAG = MERGE_BOTH

MODE_WEIGHT_CENTROID_DIST = 2.0
MODE_WEIGHT_BOUNDARY_DIST = 4.0
MODE_WEIGHT_CONVEX_HULL_DIST = 0.0
MODE_WEIGHT_ANGLE_DIFF = 1.0
MODE_WEIGHT_ASPECT_DIFF = 0.0
MODE_WEIGHT_AREA_RATIO = 1.0
MODE_WEIGHT_INT_AREA_RATIO = 2.0
MODE_WEIGHT_CURVATURE_RATIO = 0.0
MODE_WEIGHT_COMPLEXITY_RATIO = 0.0
MODE_WEIGHT_INTEN_PERC_RATIO = 0.0
MODE_WEIGHT_INTEN_PERC_VALUE = 50

MODE_NC_PAIRS_FLAG_LATLON = FALSE
MODE_NC_PAIRS_FLAG_RAW = FALSE
MODE_NC_PAIRS_FLAG_OBJECT_RAW = TRUE
MODE_NC_PAIRS_FLAG_OBJECT_ID = TRUE
MODE_NC_PAIRS_FLAG_CLUSTER_ID = TRUE
MODE_NC_PAIRS_FLAG_POLYLINES = FALSE

MODE_QUILT = False
MODE_CT_STATS_FLAG = True
MODE_PS_PLOT_FLAG = False

# member in the prefix so members don't collide; MODEL stays HRRRCast so VCAST
# pools members when member is not a group_by key (use HRRRCast_mem<M> if you
# instead want per-member spread as a separate series).
MODE_OUTPUT_PREFIX = {MODEL}_mem{ENV[MODE_MEMBER]}_{ENV[MODE_FIELD]}_{ENV[MODE_THRESH_TAG]}_{OBTYPE}

[dir]
# Forecast member GRIB2 lives under DATAROOT; obs dir is field-specific (MRMS or CCPA).
FCST_MODE_INPUT_DIR = {ENV[DATAROOT]}
OBS_MODE_INPUT_DIR  = {ENV[MODE_OBS_DIR]}
OUTPUT_BASE     = {ENV[MODE_OUTPUT_DIR]}
MODE_OUTPUT_DIR = {ENV[MODE_OUTPUT_DIR]}
STAGING_DIR     = {ENV[MODE_STAGING_DIR]}

[filename_templates]
# Forecast: raw member GRIB2  YYYYMMDD/HH/hrrrcast.mNN.tHHz.pgrb2.fLL  (member = MODE_MEMBER, 2-digit).
# Obs: field-specific template (MRMS or CCPA), passed literally via MODE_OBS_TEMPLATE.
FCST_MODE_INPUT_TEMPLATE = {init?fmt=%Y%m%d}/{init?fmt=%H}/hrrrcast.m{ENV[MODE_MEMBER]}.t{init?fmt=%H}z.pgrb2.f{lead?fmt=%HH}
OBS_MODE_INPUT_TEMPLATE  = {ENV[MODE_OBS_TEMPLATE]}
MODE_OUTPUT_TEMPLATE = {init?fmt=%Y%m%d%H}

MODE_MANDATORY = True

