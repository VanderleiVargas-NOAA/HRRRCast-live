[filename_templates]
# Must match GenEnsProd's GEN_ENS_PROD_OUTPUT_TEMPLATE, including the {init}I tag.
FCST_GRID_STAT_INPUT_TEMPLATE = gen_ens_prod_{MODEL}_REFC_{OBTYPE}_{init?fmt=%Y%m%d%H}I_{lead?fmt=%H%M%S}L_{valid?fmt=%Y%m%d}_{valid?fmt=%H%M%S}V.nc
OBS_GRID_STAT_INPUT_TEMPLATE = MergedReflectivityQComposite_00.50_{valid?fmt=%Y%m%d}-{valid?fmt=%H%M%S}.grib2
GRID_STAT_OUTPUT_TEMPLATE = {init?fmt=%Y%m%d%H}
