# GridStat METplus Configuration (ensemble probabilistic + neighborhood FSS)
# Reads the GenEnsProd NetCDF and verifies against MRMS.
#
# Dynamic values (init time, leads, input/output dirs) are supplied by
# job-gridstat.sh via environment variables and referenced here as {ENV[...]}.

[config]

PROCESS_LIST = GridStat

LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG = {ENV[INIT_STAMP]}
INIT_END = {ENV[INIT_STAMP]}
INIT_INCREMENT = 3600

LEAD_SEQ = {ENV[LEAD_SEQ]}

MODEL = HRRRCast
OBTYPE = MRMS
GRID_STAT_DESC = NA

LOG_METPLUS = {LOG_DIR}/metplus.log.GridStat_REFC_{ENV[INIT_STAMP]}
METPLUS_CONF = {GRID_STAT_OUTPUT_DIR}/metplus_final.GridStat_REFC_{ENV[INIT_STAMP]}.conf
LOG_GRID_STAT_VERBOSITY = 2

GRID_STAT_CONFIG_FILE = {PARM_BASE}/met_config/GridStatConfig_wrapped

GRID_STAT_REGRID_TO_GRID = FCST
GRID_STAT_REGRID_VLD_THRESH = 0.5
GRID_STAT_REGRID_METHOD = BUDGET
GRID_STAT_REGRID_WIDTH = 2
GRID_STAT_REGRID_SHAPE = SQUARE

GRID_STAT_INTERP_FIELD = NONE
GRID_STAT_INTERP_VLD_THRESH = 1.0
GRID_STAT_INTERP_SHAPE = SQUARE
GRID_STAT_INTERP_TYPE_METHOD = NEAREST
GRID_STAT_INTERP_TYPE_WIDTH = 1

GRID_STAT_GRID_WEIGHT_FLAG = NONE

GRID_STAT_MET_CONFIG_OVERRIDES = cat_thresh = [NA]; cnt_thresh = [NA]; cnt_logic = UNION; wind_thresh = [NA]; wind_logic = UNION; ci_alpha = [0.05]; rank_corr_flag = FALSE;

# Nearest MRMS scan within +/- 5 min of valid time
OBS_GRID_STAT_FILE_WINDOW_BEGIN = -300
OBS_GRID_STAT_FILE_WINDOW_END = 300

# Forecast fields are probabilities
FCST_IS_PROB = True
FCST_PROB_IN_GRIB_PDS = False
FCST_GRID_STAT_PROB_THRESH = ==0.1

# Per-field neighborhoods are set inline in OBS_VARn_OPTIONS below
GRID_STAT_NEIGHBORHOOD_FIELD =
GRID_STAT_NEIGHBORHOOD_WIDTH =
GRID_STAT_NEIGHBORHOOD_SHAPE =
GRID_STAT_NEIGHBORHOOD_COV_THRESH = >=0.5

GRID_STAT_ONCE_PER_FIELD = False
GRID_STAT_MASK_GRID = FULL
GRID_STAT_MASK_POLY = {MET_INSTALL_DIR}/share/met/poly/CONUS.poly
GRID_STAT_CLIMO_CDF_BINS = 1
GRID_STAT_OUTPUT_PREFIX = {MODEL}_REFC_{OBTYPE}

# ------------------------- Field definitions ------------------------
