FCST_VAR1_THRESH = ==0.1
OBS_VAR1_NAME = MergedReflectivityQComposite
OBS_VAR1_LEVELS = Z500
OBS_VAR1_THRESH = ge20
OBS_VAR1_OPTIONS = censor_thresh = lt-20; censor_val = -20.0; cnt_thresh = [ >15 ]; cnt_logic = UNION;

