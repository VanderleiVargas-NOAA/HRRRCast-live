# GenEnsProd METplus Configuration
#
# Dynamic values (init time, lead sequence, input/output dirs) are supplied by
# job-genensprod.sh via environment variables and referenced here as {ENV[...]}.

[config]

# List of applications (tools) to run.
PROCESS_LIST = GenEnsProd

# time looping - options are INIT, VALID, RETRO, and REALTIME
LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H

# Start/End time for METplus run — set per cycle by the job (YYYYMMDDHH).
INIT_BEG = {ENV[INIT_STAMP]}
INIT_END = {ENV[INIT_STAMP]}

# Increment between METplus runs (in seconds if no units are specified).
INIT_INCREMENT = 3600

# List of forecast leads to process — set per run by the job (0,1,...,LEAD_HOUR).
LEAD_SEQ = {ENV[LEAD_SEQ]}

# Specify the name of the METplus log file.
LOG_METPLUS = {LOG_DIR}/metplus.log.GenEnsProd_REFC_{ENV[INIT_STAMP]}

# Specify the location and name of the final METplus conf file.
METPLUS_CONF = {GEN_ENS_PROD_OUTPUT_DIR}/metplus_final.GenEnsProd_REFC_{ENV[INIT_STAMP]}.conf

# Name to identify model (forecast) data in output.
MODEL = HRRRCast

GEN_ENS_PROD_DESC = NA

# Name to identify observation data in output.
OBTYPE = MRMS

# Verbosity of MET logging output.  0 to 5; 0 is quiet, 5 is loud.
LOG_GEN_ENS_PROD_VERBOSITY = 2

###
# File I/O
###

# Forecast model input directory for GenEnsProd — the run root (DATAROOT).
GEN_ENS_PROD_INPUT_DIR = {ENV[DATAROOT]}

# Template for forecast input to GenEnsProd relative to GEN_ENS_PROD_INPUT_DIR.
# Comma separated list of ensemble members.
GEN_ENS_PROD_INPUT_TEMPLATE = {ENV[GENENS_MEMBERS]}

# Output directory for GenEnsProd — set per run by the job.
OUTPUT_BASE = {ENV[MET_OUTPUT_BASE]}
GEN_ENS_PROD_OUTPUT_DIR = {ENV[MET_OUTPUT_BASE]}

# Template for output from GenEnsProd relative to GEN_ENS_PROD_OUTPUT_DIR.
# Init cycle ({init?fmt=%Y%m%d%H}) is included so parallel cycles don't overwrite each other.
GEN_ENS_PROD_OUTPUT_TEMPLATE = {init?fmt=%Y%m%d%H}/gen_ens_prod_{MODEL}_REFC_{OBTYPE}_{init?fmt=%Y%m%d%H}I_{lead?fmt=%H%M%S}L_{valid?fmt=%Y%m%d_%H%M%S}V.nc

GEN_ENS_PROD_N_MEMBERS = {ENV[N_ENSEMBLES]}
GEN_ENS_PROD_SKIP_IF_OUTPUT_EXISTS = True
###
# Field Info
###
ENS_VAR1_NAME = REFC
ENS_VAR1_LEVELS = L0
ENS_VAR1_THRESH = ge20, ge30, ge40, ge50

# 1-hour accumulated precipitation. Confirm the GRIB2 encoding of your members:
#   wgrib2 <member>.pgrb2.f01 | grep -i APCP    (expect "APCP ... 1 hour acc fcst")
# Thresholds are in mm (0.254/0.508/1.27/2.54/6.35/12.7/19.05/25.4 mm =
# 0.01/0.02/0.05/0.1/0.25/0.5/0.75/1.0 in), from a trace up to 1 inch.
# NOTE: 1-h APCP is undefined at f00 (no accumulation yet); MET will warn/skip
# that field at lead 0 while REFC still processes.
ENS_VAR2_NAME = APCP
ENS_VAR2_LEVELS = A1
ENS_VAR2_THRESH = gt0.0, ge0.254, ge0.508, ge1.27, ge2.54, ge6.35, ge12.7, ge19.05, ge25.4

###
# GenEnsProd
###

# Threshold for ratio of valid files to expected files to allow app to run
GEN_ENS_PROD_ENS_THRESH = 0.05

# Neighborhood ensemble probability at 5 widths ->
#   REFC_L0_ENS_NEP_geXX_NBRHD{9,25,81,361,729}
GEN_ENS_PROD_NBRHD_PROB_WIDTH = 3, 5, 9, 19, 27
GEN_ENS_PROD_NBRHD_PROB_SHAPE = CIRCLE
GEN_ENS_PROD_NBRHD_PROB_VLD_THRESH = 0.0

GEN_ENS_PROD_ENSEMBLE_FLAG_LATLON = TRUE
GEN_ENS_PROD_ENSEMBLE_FLAG_MEAN = TRUE
GEN_ENS_PROD_ENSEMBLE_FLAG_STDEV = TRUE
GEN_ENS_PROD_ENSEMBLE_FLAG_MINUS = FALSE
GEN_ENS_PROD_ENSEMBLE_FLAG_PLUS = FALSE
GEN_ENS_PROD_ENSEMBLE_FLAG_MIN = FALSE
GEN_ENS_PROD_ENSEMBLE_FLAG_MAX = FALSE
GEN_ENS_PROD_ENSEMBLE_FLAG_RANGE = TRUE
GEN_ENS_PROD_ENSEMBLE_FLAG_VLD_COUNT = TRUE
GEN_ENS_PROD_ENSEMBLE_FLAG_FREQUENCY = TRUE
GEN_ENS_PROD_ENSEMBLE_FLAG_NEP = TRUE
GEN_ENS_PROD_ENSEMBLE_FLAG_NMEP = TRUE
GEN_ENS_PROD_ENSEMBLE_FLAG_CLIMO = FALSE
GEN_ENS_PROD_ENSEMBLE_FLAG_CLIMO_CDF = FALSE
