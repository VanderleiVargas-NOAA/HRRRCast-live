# EnsembleStat METplus Configuration — surface ensemble spread-skill vs NDAS point obs.
#
# Fields: 2-m temperature (TMP/Z2), 2-m dewpoint (DPT/Z2), 10-m wind (UGRD/VGRD/Z10).
# Reads the raw ensemble members (GRIB2) + pb2nc point obs (NetCDF) and computes
# ECNT (RMSE of mean, SPREAD, spread/skill), SSVAR, RHIST/PHIST, RPS per field.
#
# Dynamic values are supplied by job-ensemblestat.sh via {ENV[...]}.

[config]

PROCESS_LIST = EnsembleStat

LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG = {ENV[INIT_STAMP]}
INIT_END = {ENV[INIT_STAMP]}
INIT_INCREMENT = 3600
LEAD_SEQ = {ENV[LEAD_SEQ]}

MODEL  = HRRRCast
OBTYPE = NDAS

LOG_METPLUS = {LOG_DIR}/metplus.log.EnsembleStat_SFC_{ENV[INIT_STAMP]}
METPLUS_CONF = {ENSEMBLE_STAT_OUTPUT_DIR}/metplus_final.EnsembleStat_SFC_{ENV[INIT_STAMP]}.conf
LOG_ENSEMBLE_STAT_VERBOSITY = 2

ENSEMBLE_STAT_CONFIG_FILE = {PARM_BASE}/met_config/EnsembleStatConfig_wrapped

# Ensemble size / validity
ENSEMBLE_STAT_N_MEMBERS = {ENV[N_ENSEMBLES]}
ENSEMBLE_STAT_ENS_THRESH = 1.0
ENSEMBLE_STAT_VLD_THRESH = 1.0

# Regrid point obs onto the forecast grid
ENSEMBLE_STAT_REGRID_TO_GRID = FCST
ENSEMBLE_STAT_REGRID_METHOD  = BILIN
ENSEMBLE_STAT_REGRID_WIDTH   = 2

###
# Surface fields. Confirm the GRIB2 encoding of your forecast with
#   wgrib2 <member>.pgrb2.f01 | grep -iE 'TMP|DPT|GRD'
# and adjust ENS_VARn_* if needed. pb2nc obs names come from the default
# prepbufr map: TOB->TMP, TDO->DPT, UOB->UGRD, VOB->VGRD.
###
# 2-m temperature
ENS_VAR1_NAME    = TMP
ENS_VAR1_LEVELS  = Z2
FCST_VAR1_NAME   = TMP
FCST_VAR1_LEVELS = Z2
OBS_VAR1_NAME    = TMP
OBS_VAR1_LEVELS  = Z2

# 2-m dewpoint
ENS_VAR2_NAME    = DPT
ENS_VAR2_LEVELS  = Z2
FCST_VAR2_NAME   = DPT
FCST_VAR2_LEVELS = Z2
OBS_VAR2_NAME    = DPT
OBS_VAR2_LEVELS  = Z2

# 10-m U wind
ENS_VAR3_NAME    = UGRD
ENS_VAR3_LEVELS  = Z10
FCST_VAR3_NAME   = UGRD
FCST_VAR3_LEVELS = Z10
OBS_VAR3_NAME    = UGRD
OBS_VAR3_LEVELS  = Z10

# 10-m V wind
ENS_VAR4_NAME    = VGRD
ENS_VAR4_LEVELS  = Z10
FCST_VAR4_NAME   = VGRD
FCST_VAR4_LEVELS = Z10
OBS_VAR4_NAME    = VGRD
OBS_VAR4_LEVELS  = Z10

# surface obs, within +/- 30 min of valid time
ENSEMBLE_STAT_MESSAGE_TYPE = ADPSFC
OBS_ENSEMBLE_STAT_WINDOW_BEGIN = -1800
OBS_ENSEMBLE_STAT_WINDOW_END   = 1800

# masking to CONUS
ENSEMBLE_STAT_MASK_GRID = FULL
ENSEMBLE_STAT_MASK_POLY = {MET_INSTALL_DIR}/share/met/poly/CONUS.poly

ENSEMBLE_STAT_DUPLICATE_FLAG = NONE
ENSEMBLE_STAT_OBS_ERROR_FLAG = FALSE

###
# File I/O
###
OUTPUT_BASE = {ENV[ENSEMBLE_STAT_OUTPUT_DIR]}

# forecast ensemble members — list generated per N_ENSEMBLES by job-ensemblestat.sh
FCST_ENSEMBLE_STAT_INPUT_DIR = {ENV[DATAROOT]}
FCST_ENSEMBLE_STAT_INPUT_TEMPLATE = {ENV[FCST_ENS_TEMPLATE]}

# point obs (pb2nc output), one NetCDF per valid time
OBS_ENSEMBLE_STAT_POINT_INPUT_DIR = {ENV[PB2NC_OUTPUT_DIR]}
OBS_ENSEMBLE_STAT_POINT_INPUT_TEMPLATE = nam.{valid?fmt=%Y%m%d%H}.prepbufr.nc

ENSEMBLE_STAT_OUTPUT_DIR = {ENV[ENSEMBLE_STAT_OUTPUT_DIR]}
ENSEMBLE_STAT_OUTPUT_TEMPLATE =

###
# Output line types — spread-skill (ECNT, SSVAR) + distributions (RHIST/PHIST/RPS)
###
ENSEMBLE_STAT_OUTPUT_FLAG_ECNT  = STAT
ENSEMBLE_STAT_OUTPUT_FLAG_RPS   = STAT
ENSEMBLE_STAT_OUTPUT_FLAG_RHIST = STAT
ENSEMBLE_STAT_OUTPUT_FLAG_PHIST = STAT
ENSEMBLE_STAT_OUTPUT_FLAG_SSVAR = STAT
ENSEMBLE_STAT_OUTPUT_FLAG_ORANK = STAT

ENSEMBLE_STAT_NC_ORANK_FLAG_LATLON     = FALSE
ENSEMBLE_STAT_NC_ORANK_FLAG_MEAN       = FALSE
ENSEMBLE_STAT_NC_ORANK_FLAG_RANK       = FALSE
ENSEMBLE_STAT_NC_ORANK_FLAG_PIT        = FALSE
ENSEMBLE_STAT_NC_ORANK_FLAG_VLD_COUNT  = FALSE
ENSEMBLE_STAT_NC_ORANK_FLAG_WEIGHT     = FALSE
